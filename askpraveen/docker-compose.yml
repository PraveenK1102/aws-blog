services:
  db:
    image: pgvector/pgvector:pg16
    container_name: askpraveen-db
    environment:
      POSTGRES_USER: askpraveen
      POSTGRES_PASSWORD: askpraveen
      POSTGRES_DB: askpraveen
    ports:
      - "5433:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askpraveen -d askpraveen"]
      interval: 3s
      timeout: 3s
      retries: 10
